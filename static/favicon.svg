<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- خلفية داكنة متدرجة -->
    <radialGradient id="deepCanvas" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#141147"/>
      <stop offset="50%" stop-color="#080e2b"/>
      <stop offset="100%" stop-color="#01030d"/>
    </radialGradient>

    <!-- تدرج إنفينيتي الأساسي -->
    <linearGradient id="neonRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d946ef"/>
      <stop offset="30%" stop-color="#8b5cf6"/>
      <stop offset="70%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- إطار زجاجي خارجي -->
    <linearGradient id="glassRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <!-- جسم الأيقونة الخارجي -->
  <rect width="512" height="512" rx="128" fill="url(#deepCanvas)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#glassRim)" stroke-width="2.5"/>

  <!-- هالات ضوئية خلفية ناعمة -->
  <circle cx="160" cy="256" r="90" fill="#c026ff" opacity="0.25"/>
  <circle cx="352" cy="256" r="90" fill="#00e5ff" opacity="0.20"/>

  <!-- ظل مجسم تحت الشعار -->
  <path d="M 160 185 C 230 185 282 337 352 337 C 405 337 444 300 444 261 C 444 222 405 185 352 185 C 282 185 230 337 160 337 C 107 337 68 300 68 261 C 68 222 107 185 160 185 Z" 
        fill="none" 
        stroke="#000000" 
        stroke-width="56" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        opacity="0.6"/>

  <!-- رمز إنفينيتي الرئيسي الثابت -->
  <path d="M 160 180 C 230 180 282 332 352 332 C 405 332 444 295 444 256 C 444 217 405 180 352 180 C 282 180 230 332 160 332 C 107 332 68 295 68 256 C 68 217 107 180 160 180 Z" 
        fill="none" 
        stroke="url(#neonRibbon)" 
        stroke-width="52" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- خط لمعان داخلي بارز -->
  <path d="M 160 180 C 230 180 282 332 352 332 C 405 332 444 295 444 256 C 444 217 405 180 352 180 C 282 180 230 332 160 332 C 107 332 68 295 68 256 C 68 217 107 180 160 180 Z" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="4" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        opacity="0.45"/>

  <!-- نقطتا بريق مركزية -->
  <circle cx="160" cy="180" r="5" fill="#ffffff" opacity="0.9"/>
  <circle cx="352" cy="180" r="5" fill="#ffffff" opacity="0.9"/>
</svg>
