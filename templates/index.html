<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Infinity Converter 2.0 — أدوات ملفات مجانية</title>
  <meta name="description" content="منصة Infinity Converter 2.0 لمعالجة وتحويل الملفات بسرعة وأمان، مع بنية حديثة قابلة للتوسع.">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <header class="site-header">
    <div>
      <strong>∞ Infinity Converter</strong>
      <span>2.0</span>
    </div>
    <a href="/api/v2/healthz">Health</a>
  </header>

  <main class="container">
    <section class="hero">
      <span class="eyebrow">NEW ARCHITECTURE</span>
      <h1>منصة أدوات ملفات مبنية من جديد</h1>
      <p>محرك موحد للأمان والتحقق والتحويل، مع بنية قابلة لإضافة عشرات الأدوات بدون تضخيم ملف واحد.</p>
    </section>

    <section class="tool-grid" aria-label="الأدوات">
      {% for tool in tools %}
      <article class="tool-card" data-tool="{{ tool.id }}">
        <h2>{{ tool.name_ar }}</h2>
        <p>{{ tool.name_en }}</p>
        <button type="button" class="choose-tool" data-tool="{{ tool.id }}">اختيار</button>
      </article>
      {% endfor %}
    </section>

    <section class="workspace">
      <div class="workspace-head">
        <div>
          <span class="eyebrow">SMART WORKSPACE</span>
          <h2 id="selected-name">اختر أداة</h2>
        </div>
        <span id="status" class="status">جاهز</span>
      </div>

      <form id="converter-form">
        <input id="tool-id" name="tool" type="hidden">
        <label class="dropzone">
          <input id="files" name="files" type="file" multiple>
          <strong>ارفع ملفاتك هنا</strong>
          <span>سيتم التحقق من البنية والتوقيع والحجم قبل المعالجة.</span>
        </label>
        <button class="primary" type="submit">بدء التحويل</button>
      </form>

      <pre id="result" class="result" aria-live="polite"></pre>
    </section>
  </main>

  <script src="/static/js/app.js" defer></script>
</body>
</html>
