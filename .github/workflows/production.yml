name: Production quality gates
on:
  push:
    branches: [main, 'work/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: JavaScript syntax and browser calculation gates
        run: |
          node --check static/js/app.js
          node --check static/js/smart-flow.js
          node --check static/js/workflows.js
          node --check static/js/workspace.js
          node --check static/js/trust-badges.js
          node --check static/js/vitals.js
          node --check static/sw.js
          python scripts/export_browser_catalog.py /tmp/browser-catalog.json
          node scripts/browser_tool_smoke.cjs /tmp/browser-catalog.json
          node tests/browser-calculations.cjs
      - name: Real Chromium checks for canvas timer and DOM browser tools
        run: |
          command -v google-chrome
          npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.55.0
          node scripts/browser_real_quality.cjs
      - name: Audit Python dependencies and produce reproducibility evidence
        run: |
          python -m pip install --disable-pip-version-check pip-audit pip-tools
          pip-audit -r requirements.txt
          pip-audit -r requirements.txt -f cyclonedx-json -o sbom.cdx.json
          pip-compile --resolver=backtracking --generate-hashes --output-file=requirements.lock requirements.txt
      - name: Upload dependency lock and SBOM
        uses: actions/upload-artifact@v4
        with:
          name: python-supply-chain-${{ github.sha }}
          path: |
            requirements.lock
            sbom.cdx.json
          retention-days: 30
      - name: Enforce shared mobile asset performance budgets
        run: python scripts/performance_budget.py
      - name: Build Python 3.11 production image with preflight and all tests
        shell: bash
        run: |
          set -o pipefail
          docker build --progress=plain -t infinity-verified . 2>&1 | tee docker-build.log
      - name: Upload Docker build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-${{ github.sha }}
          path: docker-build.log
          retention-days: 7
      - name: Verify installed Python dependency consistency
        run: docker run --rm --network none infinity-verified python -m pip check
      - name: Verify native renderer limiter exists in production image
        run: docker run --rm --network none infinity-verified sh -c 'command -v prlimit >/dev/null && prlimit --version'
      - name: Every registered operation through the real engine
        run: docker run --rm --network none infinity-verified python scripts/full_operation_smoke.py
      - name: Every registered operation with two additional complex input profiles
        run: |
          for profile in mixed dense; do
            echo "QUALITY MATRIX: profile=$profile"
            docker run --rm --network none -e IC_TEST_FIXTURE_PROFILE="$profile" infinity-verified python scripts/output_input_matrix.py
          done
      - name: All 263 tool pages and real browser actions in mobile Chromium
        shell: bash
        run: |
          set -euo pipefail
          python scripts/export_server_catalog.py /tmp/server-catalog.json
          python scripts/export_browser_catalog.py /tmp/browser-catalog.json
          docker run --rm -d --name infinity-site-e2e -p 127.0.0.1:5000:5000 \
            -e PORT=5000 -e DATABASE_URL=sqlite:////tmp/infinity-site-e2e.db \
            -e PUBLIC_AUTH_ENABLED=0 -e PUBLIC_BILLING_ENABLED=0 infinity-verified
          trap 'docker rm -f infinity-site-e2e >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5000/api/v2/readyz > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5000/api/v2/readyz
          IC_E2E_BASE_URL=http://127.0.0.1:5000 \
            IC_E2E_REPORT=site-e2e-report.json \
            node scripts/real_site_e2e.cjs /tmp/browser-catalog.json /tmp/server-catalog.json
      - name: Upload full-site browser acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-site-e2e-${{ github.sha }}
          path: site-e2e-report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Independent source-to-output semantic audit with explicit coverage report
        run: |
          docker run --rm --network none infinity-verified python scripts/semantic_output_audit.py
      - name: Every registered operation through the HTTP API
        run: docker run --rm --network none infinity-verified python scripts/api_operation_smoke.py
      - name: Every registered HTTP operation with two additional complex input profiles
        run: |
          for profile in mixed dense; do
            echo "HTTP QUALITY MATRIX: profile=$profile"
            docker run --rm --network none -e IC_TEST_FIXTURE_PROFILE="$profile" infinity-verified python scripts/api_output_input_matrix.py
          done