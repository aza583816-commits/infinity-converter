name: Production quality gates
on:
  push:
    branches: [main, 'work/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-latest
    # Six independent conversion corpora plus two extra confirmation rounds
    # need sufficient runtime; GitHub's normal fail-fast steps remain active.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: JavaScript syntax and browser calculation gates
        run: |
          node --check static/js/app.js
          node --check static/js/smart-flow.js
          node --check static/js/workflows.js
          node --check static/js/workspace.js
          node --check static/js/trust-badges.js
          node --check static/js/vitals.js
          node --check static/sw.js
          python scripts/export_browser_catalog.py /tmp/browser-catalog.json
          node scripts/browser_tool_smoke.cjs /tmp/browser-catalog.json
          node tests/browser-calculations.cjs
      - name: Real Chromium checks for canvas timer and DOM browser tools
        run: |
          command -v google-chrome
          npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.55.0
          node scripts/browser_real_quality.cjs
      - name: Audit Python dependencies and produce reproducibility evidence
        run: |
          python -m pip install --disable-pip-version-check pip-audit pip-tools
          pip-audit -r requirements.txt
          pip-audit -r requirements.txt -f cyclonedx-json -o sbom.cdx.json
          pip-compile --resolver=backtracking --generate-hashes --output-file=requirements.lock requirements.txt
      - name: Upload dependency lock and SBOM
        uses: actions/upload-artifact@v4
        with:
          name: python-supply-chain-${{ github.sha }}
          path: |
            requirements.lock
            sbom.cdx.json
          retention-days: 30
      - name: Enforce shared mobile asset performance budgets
        run: python scripts/performance_budget.py
      - name: Build Python 3.11 production image with preflight and all tests
        shell: bash
        run: |
          set -o pipefail
          docker build --progress=plain -t infinity-verified . 2>&1 | tee docker-build.log
      - name: Upload Docker build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-${{ github.sha }}
          path: docker-build.log
          retention-days: 7
      - name: Verify installed Python dependency consistency
        run: docker run --rm --network none infinity-verified python -m pip check
      - name: Verify native renderer limiter exists in production image
        run: docker run --rm --network none infinity-verified sh -c 'command -v prlimit >/dev/null && prlimit --version'
      - name: Every registered operation through the real engine
        run: docker run --rm --network none infinity-verified python scripts/full_operation_smoke.py
      - name: Every registered operation with two additional complex input profiles
        run: |
          for profile in mixed dense; do
            echo "QUALITY MATRIX: profile=$profile"
            docker run --rm --network none -e IC_TEST_FIXTURE_PROFILE="$profile" infinity-verified python scripts/output_input_matrix.py
          done
      - name: All 263 tool pages and real browser actions in mobile Chromium
        shell: bash
        run: |
          set -euo pipefail
          python scripts/export_server_catalog.py /tmp/server-catalog.json
          python scripts/export_browser_catalog.py /tmp/browser-catalog.json
          docker run --rm -d --name infinity-site-e2e -p 127.0.0.1:5000:5000 \
            -e PORT=5000 -e DATABASE_URL=sqlite:////tmp/infinity-site-e2e.db \
            -e PUBLIC_AUTH_ENABLED=0 -e PUBLIC_BILLING_ENABLED=0 infinity-verified
          trap 'docker rm -f infinity-site-e2e >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5000/api/v2/readyz > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5000/api/v2/readyz
          IC_E2E_BASE_URL=http://127.0.0.1:5000 \
            IC_E2E_REPORT=site-e2e-report.json \
            node scripts/real_site_e2e.cjs /tmp/browser-catalog.json /tmp/server-catalog.json
      - name: Upload full-site browser acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-site-e2e-${{ github.sha }}
          path: site-e2e-report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Independent source-to-output semantic audit with explicit coverage report
        run: |
          mkdir -p semantic-audit
          chmod 777 semantic-audit # ephemeral CI output directory; container runs as non-root
          docker run --rm --network none -v "$PWD/semantic-audit:/quality-report" \
            -e IC_SEMANTIC_REPORT=/quality-report/report.json \
            infinity-verified python scripts/semantic_output_audit.py
      - name: Independent semantic checks against second bilingual and complex input corpus
        run: |
          docker run --rm --network none -v "$PWD/semantic-audit:/quality-report" \
            -e IC_TEST_FIXTURE_PROFILE=mixed \
            -e IC_SEMANTIC_REPORT=/quality-report/mixed.json \
            infinity-verified python scripts/semantic_output_audit.py
      - name: Upload per-tool semantic coverage and unresolved gaps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-quality-coverage-${{ github.sha }}
          path: semantic-audit/*.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Every registered operation through the HTTP API
        run: docker run --rm --network none infinity-verified python scripts/api_operation_smoke.py
      - name: Every registered HTTP operation with two additional complex input profiles
        run: |
          for profile in mixed dense; do
            echo "HTTP QUALITY MATRIX: profile=$profile"
            docker run --rm --network none -e IC_TEST_FIXTURE_PROFILE="$profile" infinity-verified python scripts/api_output_input_matrix.py
          done
      # Both follow-up rounds run only after the entire ordinary quality matrix
      # passed. They are intentionally not smoke-only or file-existence checks.
      - name: Follow-up verification 1 - dense independent source-to-output corpus
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ("report", "mixed"):
              p = Path("semantic-audit") / f"{name}.json"
              if not p.is_file():
                  raise SystemExit(f"Initial quality gate missing: {p}")
              r = json.loads(p.read_text(encoding="utf-8"))
              if (not r.get("total") or r.get("semantic_verified") != r["total"]
                      or r.get("unverified") or r.get("semantic_failures")
                      or not r.get("quality_complete")):
                  raise SystemExit(f"Initial {name} corpus is not quality-approved")
          PY
          docker run --rm --network none -v "$PWD/semantic-audit:/quality-report" \
            -e IC_TEST_FIXTURE_PROFILE=dense \
            -e IC_SEMANTIC_REPORT=/quality-report/dense.json \
            infinity-verified python scripts/semantic_output_audit.py
      - name: Follow-up verification 2 - fresh isolated release candidate replay
        shell: bash
        run: |
          set -euo pipefail
          # Repeat semantic assertions in fresh containers rather than reusing
          # the original outputs or reports. Check actual API results and the
          # independent real-browser calculations again as a separate pass.
          for profile in baseline mixed dense; do
            echo "RELEASE CANDIDATE independent full-output replay: $profile"
            env_args=()
            if [ "$profile" != baseline ]; then
              env_args=(-e "IC_TEST_FIXTURE_PROFILE=$profile")
            fi
            docker run --rm --network none -v "$PWD/semantic-audit:/quality-report" \
              "${env_args[@]}" -e "IC_SEMANTIC_REPORT=/quality-report/rc-$profile.json" \
              infinity-verified python scripts/semantic_output_audit.py
          done
          docker run --rm --network none infinity-verified python scripts/api_operation_smoke.py
          node scripts/browser_real_quality.cjs
      - name: Upload final independent verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-quality-replay-${{ github.sha }}
          path: semantic-audit/*.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Block release until every tool has an independent output oracle
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          approved = ("report", "mixed", "dense", "rc-baseline", "rc-mixed", "rc-dense")
          expected_ids = None
          for profile in approved:
              report = Path("semantic-audit") / f"{profile}.json"
              if not report.is_file():
                  raise SystemExit(f"BLOCK RELEASE: missing independent semantic report for {profile}")
              result = json.loads(report.read_text(encoding="utf-8"))
              total = result.get("total", 0)
              verified = result.get("semantic_verified", 0)
              failures = result.get("semantic_failures", [])
              uncovered = result.get("unverified", [])
              print(f"{profile} independent output oracles: {verified}/{total}; failures={len(failures)}; uncovered={len(uncovered)}")
              ids = set(result.get("verifications", {}))
              if len(ids) != total or (expected_ids is not None and ids != expected_ids):
                  raise SystemExit(f"BLOCK RELEASE: missing, duplicate, or inconsistent tool IDs in {profile}")
              expected_ids = ids
              if not total or verified != total or uncovered or failures or not result.get("quality_complete", False):
                  print("BLOCK RELEASE: engine/API/browser smoke success cannot certify actual output semantics.")
                  print("Missing independent oracles:", ", ".join(uncovered))
                  raise SystemExit(1)
          PY
