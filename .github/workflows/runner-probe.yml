name: Runner provisioning probe
on:
  pull_request:
    paths:
      - '.github/workflows/runner-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runner-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify GitHub can allocate a hosted runner
        run: |
          echo "GitHub-hosted runner allocated"
          uname -a
